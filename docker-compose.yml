# Wescalp na VPS: banco, coletor ao vivo e candles em dia. Backfill e rótulos avulsos rodam sob demanda:
#   docker compose run --rm backfill --weeks 100
#   docker compose run --rm labels --tp 1.5 --sl 1 --bars 12
name: wescalp

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wescalp
      POSTGRES_PASSWORD: ${WESCALP_DB_PASSWORD:?defina WESCALP_DB_PASSWORD no .env}
      POSTGRES_DB: wescalp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wescalp"]
      interval: 10s
      retries: 10
    # Não disputar memória com Livegenda/emqhero na mesma VPS.
    mem_limit: 1g

  collector:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sem mensagem da KuCoin há mais de 2 min = coletor travado.
      test: ["CMD-SHELL", "find /tmp/wescalp-collector.heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      retries: 3
    mem_limit: 256m

  candles:
    # Mantém a tabela candles em dia para o painel: completa as 100 semanas e depois busca os novos a cada minuto.
    build: .
    restart: unless-stopped
    entrypoint: ["python", "-m", "wescalp.backfill", "--weeks", "100", "--follow"]
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  web:
    # Painel (wescalp.web): gráfico, marcas, fluxo e estado do coletor. Só lê o banco.
    # Sem porta no host: o Caddy da VPS (app-caddy-1, rede app_default) faz reverse_proxy wescalp-web:8090,
    # com basic_auth lá.
    build: .
    restart: unless-stopped
    command: ["python", "-m", "wescalp.web"]
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
      WESCALP_WEB_PORT: "8090"
      # Mesmo volume do banco, só leitura: mede o espaço livre do disco onde o Postgres grava.
      WESCALP_HEALTH_DISK_PATH: /pgdata
    volumes:
      - db-data:/pgdata:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      caddy:
        aliases: [wescalp-web]
    # Pico medido: ~57 MB em uso normal e ~130 MB com 6 h de livro no /api/flow (216 mil linhas; um por vez).
    mem_limit: 320m

  backfill:
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "wescalp.backfill"]
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  labels:
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "wescalp.labels"]
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

volumes:
  db-data:

networks:
  # Rede do Caddy compartilhado da VPS (compose do Livegenda). Só o web entra nela.
  # Fora da VPS, sem essa rede, crie uma vazia antes: docker network create app_default
  caddy:
    external: true
    name: app_default
