# Wescalp na VPS: banco + coletor ao vivo. Backfill e rótulos rodam sob demanda:
#   docker compose run --rm backfill --weeks 100
#   docker compose run --rm labels --tp 1.5 --sl 1 --bars 12
name: wescalp

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wescalp
      POSTGRES_PASSWORD: ${WESCALP_DB_PASSWORD:?defina WESCALP_DB_PASSWORD no .env}
      POSTGRES_DB: wescalp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wescalp"]
      interval: 10s
      retries: 10
    # Não disputar memória com Livegenda/emqhero na mesma VPS.
    mem_limit: 1g

  collector:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sem mensagem da KuCoin há mais de 2 min = coletor travado.
      test: ["CMD-SHELL", "find /tmp/wescalp-collector.heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      retries: 3
    mem_limit: 256m

  health:
    # Vigia: avisa (webhook/Telegram) quando o livro ou os negócios param, o banco some ou o disco enche.
    # Sem depends_on de saúde: se o banco não subir, o vigia precisa estar de pé para avisar.
    build: .
    restart: unless-stopped
    command: ["python", "-m", "wescalp.health", "--watch"]
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
      # Mesmo volume do banco, só leitura: mede o espaço livre do disco onde o Postgres grava.
      WESCALP_HEALTH_DISK_PATH: /pgdata
      WESCALP_ALERT_WEBHOOK: ${WESCALP_ALERT_WEBHOOK:-}
      WESCALP_TELEGRAM_TOKEN: ${WESCALP_TELEGRAM_TOKEN:-}
      WESCALP_TELEGRAM_CHAT_ID: ${WESCALP_TELEGRAM_CHAT_ID:-}
      WESCALP_HEALTH_INTERVAL_S: ${WESCALP_HEALTH_INTERVAL_S:-60}
      WESCALP_HEALTH_REPEAT_HOURS: ${WESCALP_HEALTH_REPEAT_HOURS:-6}
    volumes:
      - db-data:/pgdata:ro
    depends_on:
      - db
    mem_limit: 96m

  backfill:
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "wescalp.backfill"]
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  labels:
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "wescalp.labels"]
    environment:
      DATABASE_URL: postgresql://wescalp:${WESCALP_DB_PASSWORD}@db:5432/wescalp
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

volumes:
  db-data:
