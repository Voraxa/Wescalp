[project]
name = "wescalp"
version = "0.1.0"
description = "Bot de scalping de BTC na KuCoin"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "psycopg[binary,pool]>=3.2",
    # Painel (wescalp.web): Starlette é só o roteador ASGI, sem ORM nem templates; uvicorn serve.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Pesquisa com modelo (wescalp.ml); roda na máquina de desenvolvimento, não entra na imagem da VPS.
ml = ["numpy>=1.26", "lightgbm>=4"]
# Modelo bayesiano (wescalp.bayes), também só na pesquisa.
bayes = ["numpy>=1.26", "scipy>=1.11", "jax>=0.4.30", "numpyro>=0.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wescalp"]

[tool.setuptools.package-data]
wescalp = ["static/*"]
